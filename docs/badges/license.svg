<svg xmlns="http://www.w3.org/2000/svg" width="84" height="20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <g shape-rendering="crispEdges">
    <rect width="50" height="20" fill="#555"/>
    <rect x="50" width="34" height="20" fill="#67ac09"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="255" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3" textLength="380">license</text>
    <text x="255" y="130" transform="scale(.1)" textLength="380">license</text>
    <text x="670" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3" textLength="200">MIT</text>
    <text x="670" y="130" transform="scale(.1)" textLength="200">MIT</text>
  </g>
</svg>
